name: Coupled controller-plant trials

on:
  push:
    branches: [model-trials]
  workflow_dispatch:
    inputs:
      cases:
        description: 'Space-separated case folder names; leave blank for all nine'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  matlab_export:
    runs-on: [self-hosted, Windows, X64, matlab]
    env:
      CASE_SELECTION: ${{ inputs.cases }}
    steps:
      - uses: actions/checkout@v4
      - name: Export controller and plant FMUs and MATLAB references
        shell: powershell
        run: |
          $matlab = Join-Path $env:ProgramFiles 'MATLAB\R2026b\bin\matlab.exe'
          if (-not (Test-Path -LiteralPath $matlab)) { throw "MATLAB not found: $matlab" }
          if (-not $env:MW_MINGW64_LOC) {
            $env:MW_MINGW64_LOC = 'D:\thesis\ci-fmi\docs\experiments\matlab_algebraic_adder_loops\build\toolchain\mingw64'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $env:MW_MINGW64_LOC 'bin\gcc.exe'))) {
            throw 'Set MW_MINGW64_LOC to an installed MinGW64 compiler directory.'
          }
          $runId = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $selected = @($env:CASE_SELECTION.Split(' ') | Where-Object { $_ })
          py -3.13 docs/experiments/run_coupled_models.py build --run-id $runId --matlab $matlab @selected
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coupled-matlab-build
          path: docs/experiments/*/build/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn

  python_validation:
    needs: matlab_export
    runs-on: windows-latest
    env:
      CASE_SELECTION: ${{ inputs.cases }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: coupled-matlab-build
          path: docs/experiments
      - name: Run the master and compare with MATLAB
        shell: powershell
        run: |
          python -m pip install fmpy==0.3.26 networkx==3.6.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runId = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $selected = @($env:CASE_SELECTION.Split(' ') | Where-Object { $_ })
          python docs/experiments/run_coupled_models.py check --run-id $runId @selected
          exit $LASTEXITCODE
      - name: Summarize rollback evidence
        if: always()
        shell: powershell
        run: |
          $runId = "$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $lines = @('## Coupled controller-plant rollback tests', '', '| Case | Status | Steps with retries | Max iterations | Restore probes | Restore disabled |', '| --- | --- | ---: | ---: | --- | --- |')
          $metricLines = @('', '### Python master with rollback vs MATLAB simulation', '', '| Case | Signal | RMSE | MAE | Max absolute error | Relative RMSE |', '| --- | --- | ---: | ---: | ---: | ---: |')
          $exactLines = @('', '### Python master and MATLAB simulation vs exact solution', '', '| Case | Compared | Signal | RMSE | Max absolute error | Relative RMSE |', '| --- | --- | --- | ---: | ---: | ---: |')
          Get-ChildItem docs/experiments -Directory | ForEach-Object {
            $path = Join-Path $_.FullName "build/$runId/result.json"
            if (-not (Test-Path -LiteralPath $path)) { return }
            $result = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
            $loop = $result.rollback.loop
            $probes = if ($result.restore_probes) { ($result.restore_probes.PSObject.Properties | ForEach-Object { "$($_.Name): replay=$($_.Value.replay_identical), stateful=$($_.Value.stateful)" }) -join '; ' } else { '-' }
            $sensitivity = if ($result.restore_sensitivity) { $result.restore_sensitivity.evidence } else { '-' }
            $lines += "| $($result.experiment) | $($result.status) | $($loop.steps_with_retries) | $($loop.max_iterations) | $probes | $sensitivity |"
            if ($result.metrics) {
              $result.metrics.PSObject.Properties | ForEach-Object {
                $value = $_.Value
                $relative = if ($null -ne $value.relative_rmse_percent) { "$($value.relative_rmse_percent)%" } else { 'N/A' }
                $metricLines += "| $($result.experiment) | $($_.Name) | $($value.rmse) | $($value.mae) | $($value.max_abs_error) | $relative |"
              }
            }
            if ($result.exact_solution) {
              $result.exact_solution.PSObject.Properties | ForEach-Object {
                $source = $_.Name
                $_.Value.PSObject.Properties | ForEach-Object {
                  $value = $_.Value
                  $relative = if ($null -ne $value.relative_rmse_percent) { "$($value.relative_rmse_percent)%" } else { 'N/A' }
                  $exactLines += "| $($result.experiment) | $source | $($_.Name) | $($value.rmse) | $($value.max_abs_error) | $relative |"
                }
              }
            }
            foreach ($reason in @($result.reasons)) { if ($reason) { $lines += "| | reason: $reason | | | | |" } }
          }
          $lines += $metricLines
          if ($exactLines.Count -gt 5) { $lines += $exactLines }
          $lines += ''
          $lines += 'The feedback is a same-time connection and the Simulink reference has no delay. rollback_verified means: every FMU repeats a step identically after restore, the master planned controller and plant as a rollback loop, every step converged and at least one needed a retry, and disabling setFMUstate changed or broke the run. The error table compares the Python master output with the MATLAB closed-loop simulation; it has no pass threshold.'
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coupled-comparison-results
          path: docs/experiments/*/build/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
